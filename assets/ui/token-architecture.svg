<rect x="488" y="196" width="232" height="4" rx="4" fill="#007AFF"/>
<text x="488" y="246" font-size="20" font-weight="700" fill="#111827">design tokens</text>
<text x="488" y="272" font-size="14" font-weight="500" fill="#005FCC">(design.mjs)</text>
<rect x="488" y="288" width="232" height="44" rx="8" fill="#007AFF" fill-opacity="0.08"/>
<text x="500" y="315" font-size="13" font-weight="500" fill="#005FCC">Canonical names + values</text>
