<text x="384" y="266" font-size="12" font-weight="500" fill="#6B7280" text-anchor="middle">compile</text>
<path d="M756 280 C812 280 812 196 860 196" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowNeutral)"/>
<text x="806" y="184" font-size="12" font-weight="500" fill="#6B7280" text-anchor="middle">emit</text>
<path d="M756 280 C812 280 812 312 860 312" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowNeutral)"/>
<text x="806" y="300" font-size="12" font-weight="500" fill="#6B7280" text-anchor="middle">resolve</text>
<path d="M756 280 C812 280 812 428 860 428" fill="none" stroke="#9CA3AF" stroke-width="2" marker-end="url(#arrowNeutral)"/>
<text x="806" y="416" font-size="12" font-weight="500" fill="#6B7280" text-anchor="middle">adapt</text>
<rect x="56" y="486" width="1088" height="36" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
<text x="68" y="509" font-size="13" font-weight="400" fill="#6B7280">Tokens are consumed at build time and at runtime, so every surface stays aligned.</text>
<text x="1012" y="509" font-size="12" font-weight="500" fill="#9CA3AF">IR - tokens - emitters</text>
</svg>
