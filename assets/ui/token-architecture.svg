<circle cx="903" cy="183" r="2" fill="#6B7280"/><circle cx="903" cy="193" r="2" fill="#6B7280"/><circle cx="913" cy="183" r="2" fill="#6B7280"/><circle cx="913" cy="193" r="2" fill="#6B7280"/>
<text x="940" y="190" font-size="14" font-weight="600" fill="#111827">DOM emitter</text>
<text x="940" y="210" font-size="12" font-weight="400" fill="#6B7280">CSS variables + attributes</text>
<rect x="872" y="268" width="272" height="88" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadowSm)"/>
