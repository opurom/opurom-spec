<text x="940" y="306" font-size="14" font-weight="600" fill="#111827">native renderer</text>
<text x="940" y="326" font-size="12" font-weight="400" fill="#6B7280">Style resolution at runtime</text>
<rect x="872" y="384" width="272" height="88" rx="16" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" filter="url(#shadowSm)"/>
<rect x="888" y="400" width="40" height="40" rx="8" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1"/>
<path d="M899 414 H905 L907 417 H917 V427 H899 Z" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linejoin="round"/>
